<!-- Composição visual do hero — técnica, confiança, eletricidade/instalações -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Ilustração técnica das soluções de instalações de Sampaio Soluções">
  <defs>
    <linearGradient id="gradBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#162845"/>
    </linearGradient>
    <linearGradient id="gradAceno" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="700" fill="url(#gradBg)"/>

  <!-- Elementos de grade suspensa (linha de montagem) -->
  <g stroke="#2a3f63" stroke-width="1" opacity="0.5">
    <line x1="80" y1="80" x2="1120" y2="80"/>
    <line x1="80" y1="160" x2="1120" y2="160"/>
    <line x1="80" y1="240" x2="1120" y2="240"/>
    <line x1="80" y1="320" x2="1120" y2="320"/>
    <line x1="80" y1="400" x2="1120" y2="400"/>
    <line x1="80" y1="480" x2="1120" y2="480"/>
    <line x1="80" y1="560" x2="1120" y2="560"/>
    <line x1="80" y1="640" x2="1120" y2="640"/>
  </g>

  <!-- Painel elétrico (centro-esquerda) -->
  <g transform="translate(220, 260)">
    <rect width="420" height="180" rx="12" fill="#1d3557" stroke="#2a3f63" stroke-width="2"/>
    <rect x="20" y="20" width="380" height="140" rx="8" fill="#0f1f3d" stroke="#2a3f63" stroke-width="1"/>
    <g fill="#ffd23f">
      <rect x="40" y="40" width="60" height="60" rx="6"/>
      <rect x="120" y="40" width="60" height="60" rx="6"/>
      <rect x="200" y="40" width="60" height="60" rx="6"/>
      <rect x="280" y="40" width="60" height="60" rx="6"/>
      <rect x="360" y="40" width="60" height="60" rx="6"/>
      <rect x="40" y="110" width="60" height="40" rx="6"/>
      <rect x="120" y="110" width="60" height="40" rx="6"/>
      <rect x="200" y="110" width="60" height="40" rx="6"/>
      <rect x="280" y="110" width="60" height="40" rx="6"/>
      <rect x="360" y="110" width="60" height="40" rx="6"/>
    </g>
    <g fill="#ffd23f">
      <circle cx="70" cy="70" r="6"/>
      <circle cx="150" cy="70" r="6"/>
      <circle cx="230" cy="70" r="6"/>
      <circle cx="310" cy="70" r="6"/>
      <circle cx="390" cy="70" r="6"/>
      <circle cx="120" cy="130" r="6"/>
      <circle cx="200" cy="130" r="6"/>
      <circle cx="380" cy="130" r="6"/>
    </g>
    <!-- Fiação conectando -->
    <path d="M40 110 L40 150" stroke="#ffd23f" stroke-width="2" fill="none"/>
    <path d="M120 110 L120 150" stroke="#ffd23f" stroke-width="2" fill="none"/>
    <path d="M200 110 L200 150" stroke="#ffd23f" stroke-width="2" fill="none"/>
    <path d="M280 110 L280 150" stroke="#ffd23f" stroke-width="2" fill="none"/>
    <path d="M360 110 L360 150" stroke="#ffd23f" stroke-width="2" fill="none"/>
    <circle cx="40" cy="150" r="5" fill="#ffd23f"/>
    <circle cx="120" cy="150" r="5" fill="#ffd23f"/>
    <circle cx="200" cy="150" r="5" fill="#ffd23f"/>
    <circle cx="280" cy="150" r="5" fill="#ffd23f"/>
    <circle cx="360" cy="150" r="5" fill="#ffd23f"/>
    <path d="M20 150 L200 150" stroke="#2a3f63" stroke-width="1" fill="none"/>
  </g>

  <!-- Multímetro (centro-direito) -->
  <g transform="translate(900, 180)">
    <rect width="240" height="140" rx="12" fill="#0f1f3d" stroke="#2a3f63" stroke-width="2"/>
    <rect x="40" y="24" width="160" height="40" rx="6" fill="#4a5568"/>
    <rect x="60" y="32" width="120" height="8" rx="3" fill="#ffd23f"/>
    <rect x="60" y="56" width="120" height="8" rx="3" fill="#4a5568"/>
    <rect x="60" y="74" width="120" height="8" rx="3" fill="#4a5568"/>
    <rect x="60" y="92" width="90" height="8" rx="3" fill="#4a5568"/>
    <rect x="60" y="110" width="60" height="8" rx="3" fill="#4a5568"/>
    <circle cx="120" cy="180" r="40" fill="none" stroke="#ffd23f" stroke-width="4"/>
    <circle cx="120" cy="180" r="20" fill="none" stroke="#ffd23f" stroke-width="2"/>
    <path d="M120 180 L120 200" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Alicate (esquerda) -->
  <g transform="translate(110, 440)">
    <path d="M0 60 L160 60 L180 0 L240 60 L400 60 L420 0" fill="none" stroke="#0f1f3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M160 60 L180 0 L240 60" fill="#ffd23f" stroke="#0f1f3d" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Chave de fenda (direita) -->
  <g transform="translate(880, 480)">
    <rect x="0" y="180" width="120" height="60" rx="10" fill="#0f1f3d"/>
    <rect x="30" y="150" width="60" height="10" rx="3" fill="#ffd23f"/>
    <path d="M90 150 L120 240" fill="none" stroke="#ffd23f" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 240 L100 260 L120 280" fill="#ffd23f" stroke="#0f1f3d" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Botão aceno (início) -->
  <g transform="translate(600, 600)">
    <rect x="-50" y="-30" width="100" height="100" rx="50" fill="url(#gradAceno)" opacity="0.95"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#0f1f3d" stroke-width="6"/>
    <text x="0" y="-2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#0f1f3d">✓</text>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#0f1f3d" font-weight="600">Sampaio Soluções</text>
  </g>

  <!-- Texto de destaque -->
  <g fill="#ffd23f" font-family="system-ui, -apple-system, sans-serif">
    <text x="350" y="70" font-size="20" font-weight="700">INSTALAÇÕES ELÉTRICAS</text>
    <text x="850" y="70" font-size="20" font-weight="700">SISTEMAS DE SEGURANÇA</text>
    <text x="350" y="670" font-size="18" opacity="0.85">Fiação, tomadas, quadros, iluminação</text>
    <text x="850" y="670" font-size="18" opacity="0.85">Câmeras, fechaduras, automação</text>
  </g>
</svg>
